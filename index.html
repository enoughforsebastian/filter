<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#5b0714" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>#ENOughforSebastian Bingkai Foto Pernikahan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">Bingkai foto pernikahan</div>
      <h1>#ENOughforSebastian</h1>
      <p>Buat foto Story dengan bingkai langsung di ponselmu. Fotomu tetap tersimpan di perangkatmu.</p>
    </header>

    <section class="stage-wrap" aria-label="Editor foto">
      <canvas id="canvas" width="1080" height="1920"></canvas>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">♡</div>
        <strong>Tambahkan foto</strong>
        <span>Lalu geser untuk mengatur posisi dan cubit untuk memperbesar atau memperkecil.</span>
      </div>
    </section>

    <section class="controls">
      <div class="button-row">
        <label class="button primary">
          <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
          Ambil Foto
        </label>
        <label class="button secondary">
          <input id="galleryInput" type="file" accept="image/*" hidden />
          Pilih Foto
        </label>
      </div>

      <div id="editControls" class="edit-controls" hidden>
        <label class="slider-label" for="zoom">Perbesar / Perkecil</label>
        <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" />
        <div class="button-row compact">
          <button id="resetBtn" class="button ghost" type="button">Atur Ulang</button>
          <button id="saveBtn" class="button primary" type="button">Simpan Foto</button>
          <button id="shareBtn" class="button secondary" type="button">Bagikan</button>
        </div>
      </div>
    </section>

    <footer>
      <span>Hasil: 1080 × 1920 px · 9:16</span>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
